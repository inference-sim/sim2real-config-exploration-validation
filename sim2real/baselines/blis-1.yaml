scenario:
- name: blis-1

  model:
    name: meta-llama/Llama-3.1-8B  # from workload.model
    shortName: meta-llama-llama-3-1-8b  # derived from model name (lookup table)
    path: models/meta-llama/Llama-3.1-8B  # derived from model name (lookup table)
    huggingfaceId: meta-llama/Llama-3.1-8B  # from workload.model
    size: 1Ti  # lookup table (storage estimate)
    maxModelLen: 131072  # lookup table (model's max context window)
    blockSize: 32  # from vllm_args.block_size
    gpuMemoryUtilization: 0.9  # from vllm_args.gpu_memory_utilization

  vllmCommon:
    flags:
      enforceEager: false  # from vllm_args.enforce_eager

  decode:
    replicas: 1  # from vllm_args.num_instances
    acceleratorType:
      labelKey: nvidia.com/gpu.product
      labelValue: NVIDIA-H100-80GB-HBM3  # from workload.hardware (lookup table)
    vllm:
      additionalFlags:
      - "--max-num-seqs=256"  # from vllm_args.max_num_seqs
      - "--max-num-batched-tokens=4096"  # from vllm_args.max_num_batched_tokens
      - "--enable-chunked-prefill"  # from vllm_args.enable_chunked_prefill
      - "--no-enable-prefix-caching"  # from vllm_args.enable_prefix_caching
      - "--dtype=bfloat16"  # from vllm_args.dtype

