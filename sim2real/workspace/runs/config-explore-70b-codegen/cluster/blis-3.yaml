scenario:
- name: blis-3

  model:
    name: meta-llama/Llama-3.1-70B  # from workload.model
    shortName: meta-llama-llama-3-1-70b  # derived from model name (lookup table)
    path: models/meta-llama/Llama-3.1-70B  # derived from model name (lookup table)
    huggingfaceId: meta-llama/Llama-3.1-70B  # from workload.model
    size: 1Ti  # lookup table (storage estimate)
    blockSize: 16  # from vllm_args.block_size
    gpuMemoryUtilization: 0.9  # from vllm_args.gpu_memory_utilization

  vllmCommon:
    flags:
      enforceEager: false  # from vllm_args.enforce_eager

  decode:
    replicas: 1  # from vllm_args.num_replicas
    acceleratorType:
      labelKey: nvidia.com/gpu.product
      labelValue: NVIDIA-H100-80GB-HBM3  # from workload.hardware (lookup table)
    extraEnvVars:
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /tmp
    - name: USER
      value: vllm
    parallelism:
      data: 1  # from vllm_args.data_parallel_size
      dataLocal: 1  # from vllm_args.data_parallel_size
      tensor: 8  # from vllm_args.tensor_parallel_size
      workers: 8  # from vllm_args.tensor_parallel_size
    vllm:
      additionalFlags:
      - "--max-num-seqs=256"  # from vllm_args.max_num_seqs
      - "--max-num-batched-tokens=8192"  # from vllm_args.max_num_batched_tokens
      - "--enable-chunked-prefill"  # from vllm_args.enable_chunked_prefill
      - "--no-enable-prefix-caching"  # from vllm_args.enable_prefix_caching
      - "--dtype=bfloat16"  # from vllm_args.dtype

  huggingface:
    secretName: hf-secret

  inferenceExtension:
    pluginsConfigFile: "blis-3-routing.yaml"
    pluginsCustomConfig:
      blis-3-routing.yaml: |
        apiVersion: inference.networking.x-k8s.io/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: decode-filter
        - type: max-score-picker
        - type: prefix-cache-scorer
        - type: queue-scorer
        - type: single-profile-handler
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: decode-filter
          - pluginRef: max-score-picker
          - pluginRef: queue-scorer
            weight: 1

