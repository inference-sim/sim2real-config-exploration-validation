# LLMServingSim Profiler Job - Meta-Llama-3-8B
#
# Profiles Meta-Llama-3-8B on H100 at TP=1,2,4 for use in config exploration experiments.
# Uses single-GPU TP emulation (the profiler shrinks the model config to match per-rank
# kernel shapes, so only 1 GPU is needed regardless of TP degree).
#
# Prerequisites:
#   - Secret "hf-secret" with key "HF_TOKEN" exists in namespace jchen
#
# Usage:
#   kubectl apply -f llmservingsim-profiler-llama3-8b.yaml -n jchen
#
# To delete and retry:
#   kubectl delete -f llmservingsim-profiler-llama3-8b.yaml -n jchen

---
apiVersion: batch/v1
kind: Job
metadata:
  name: llmservingsim-profiler-llama3-8b
  namespace: jchen
  labels:
    app: llmservingsim-profiler
    experiment: config-exploration
    model: meta-llama-3-8b
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 14400  # 4h hard cap (8B is much faster than 70B)
  template:
    metadata:
      labels:
        app: llmservingsim-profiler
        model: meta-llama-3-8b
    spec:
      restartPolicy: Never

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-H100-80GB-HBM3

      containers:
        - name: profiler
          image: vllm/vllm-openai:v0.19.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              echo "=== Installing dependencies ==="
              pip install --no-cache-dir datasets matplotlib pyyaml >/dev/null 2>&1

              echo "=== Cloning LLMServingSim ==="
              cd /workspace
              if [ ! -d "LLMServingSim" ]; then
                apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1
                git clone --recurse-submodules https://github.com/casys-kaist/LLMServingSim.git
              fi
              cd LLMServingSim

              DEST=/data/llmservingsim-profiler/H100
              mkdir -p "$DEST"

              copy_partial() {
                echo "=== Copying partial results to data PVC ==="
                cp -r profiler/perf/H100/meta-llama "$DEST/" 2>/dev/null || true
                ls -lR "$DEST/" 2>/dev/null || true
              }
              trap copy_partial EXIT

              echo "=== Applying profiler patch (bypass torch.profiler hang) ==="
              echo "" | base64 -d > /workspace/patch_profiler.py
              python3 /workspace/patch_profiler.py

              echo "=== Starting profiler for meta-llama/Meta-Llama-3-8B ==="
              for tp in 1 2 4; do
                echo "=== Profiling TP=$tp ==="
                python3 -m profiler profile meta-llama/Meta-Llama-3-8B \
                  --hardware H100 \
                  --tp "1,$tp" \
                  --max-num-seqs 512 \
                  --max-num-batched-tokens 2048 \
                  --measurement-iterations 3 \
                  --verbose
                copy_partial
              done

              echo "=== Profiling complete ==="
              ls -lR "$DEST/"

          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: HF_TOKEN
            - name: HF_HOME
              value: /workspace/.cache/huggingface
            - name: HOME
              value: /workspace

          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"

          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm

      volumes:
        - name: workspace
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
        - name: dshm
          emptyDir:
            medium: Memory
