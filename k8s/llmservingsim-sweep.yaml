# LLMServingSim Config Sweep Job
#
# Runs LLMServingSim config sweep across 1,408 configs (CPU-only, uses profiling data
# from llmservingsim-profiler job). Single-point evaluator with external sweep loop.
#
# Purpose:
#   - Install LLMServingSim
#   - Copy profiling data from /data/llmservingsim-profiler/ (generated by profiler job)
#   - Prune config space if needed
#   - Sweep all valid configs with LLMServingSim
#   - Results written to /data/config-exploration/results/raw/llmservingsim.json
#
# Prerequisites:
#   - llmservingsim-profiler job has completed successfully
#   - setup-job has completed successfully (workloads generated)
#   - PVC "data-pvc" exists with profiling data at /data/llmservingsim-profiler/
#   - Secret "hf-secret" with key "HF_TOKEN" exists in namespace jchen
#
# Usage:
#   kubectl apply -f llmservingsim-sweep.yaml -n jchen
#
# To delete and retry:
#   kubectl delete -f llmservingsim-sweep.yaml -n jchen

---
apiVersion: batch/v1
kind: Job
metadata:
  name: llmservingsim-sweep
  namespace: jchen
  labels:
    app: llmservingsim-sweep
    experiment: config-exploration
    tool: llmservingsim
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 86400  # 24h hard cap
  template:
    metadata:
      labels:
        app: llmservingsim-sweep
        experiment: config-exploration
        tool: llmservingsim
    spec:
      restartPolicy: Never

      containers:
        - name: sweep
          image: python:3.11-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              echo "=== Installing dependencies ==="
              apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1
              pip install --no-cache-dir pydantic pyyaml datasets matplotlib >/dev/null 2>&1

              echo "=== Cloning LLMServingSim ==="
              cd /workspace
              git clone --recurse-submodules https://github.com/casys-kaist/LLMServingSim.git
              cd LLMServingSim
              # No installation needed, use via python3 -m

              echo "=== Verifying profiling data exists ==="
              ls -lR /data/llmservingsim-profiler/H100/meta-llama/ || {
                echo "ERROR: Profiling data not found. Run llmservingsim-profiler job first."
                exit 1
              }

              echo "=== Copying profiling data to workspace ==="
              mkdir -p /workspace/LLMServingSim/profiler/perf/H100
              cp -r /data/llmservingsim-profiler/H100/meta-llama /workspace/LLMServingSim/profiler/perf/H100/

              echo "=== Cloning experiment repo ==="
              cd /workspace
              git clone https://github.com/inference-sim/sim2real-config-exploration-validation.git
              cd sim2real-config-exploration-validation
              git submodule update --init --recursive

              echo "=== Running prune (if needed) ==="
              python3 -m experiments.run_all prune --tool llmservingsim --results-dir /data/config-exploration/results

              echo "=== Running LLMServingSim sweep ==="
              python3 -m experiments.run_all sweep --tool llmservingsim --results-dir /data/config-exploration/results

              echo "=== Sweep complete ==="
              ls -lh /data/config-exploration/results/raw/llmservingsim.json || true

          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: HF_TOKEN
            - name: HF_HOME
              value: /workspace/.cache/huggingface
            - name: HOME
              value: /workspace

          resources:
            limits:
              cpu: "8"
              memory: "32Gi"
            requests:
              cpu: "8"
              memory: "32Gi"

          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: data
              mountPath: /data

      volumes:
        - name: workspace
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
