# BLIS (inference-sim) Parallel Config Sweep - Indexed Job
#
# Runs the full 97,920-config sweep in parallel across 512 pods.
# Each pod evaluates its shard (~192 configs) with binary rate search at 10k requests.
# Results written to per-shard files on data-pvc, aggregated by blis-aggregate.yaml.
#
# Prerequisites:
#   - setup-job has completed (blis binary at /data/config-exploration/bin/blis)
#   - PVC "data-pvc" exists in namespace jchen
#
# Usage:
#   kubectl apply -f k8s/blis-sweep.yaml -n jchen
#
# Monitor:
#   kubectl get jobs blis-sweep -n jchen -w
#   kubectl logs -l job-name=blis-sweep -n jchen --tail=5
#
# After completion, run blis-aggregate.yaml to concatenate shard files.
#
# To delete and retry:
#   kubectl delete -f k8s/blis-sweep.yaml -n jchen

---
apiVersion: batch/v1
kind: Job
metadata:
  name: blis-sweep
  namespace: jchen
  labels:
    app: blis-sweep
    experiment: config-exploration
    tool: blis
spec:
  completionMode: Indexed
  completions: 512
  parallelism: 512
  backoffLimit: 20
  activeDeadlineSeconds: 86400  # 24h hard cap
  template:
    metadata:
      labels:
        app: blis-sweep
        experiment: config-exploration
        tool: blis
    spec:
      restartPolicy: Never

      containers:
        - name: sweep
          image: python:3.11-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              pip install --no-cache-dir pydantic pyyaml >/dev/null 2>&1

              cd /data/config-exploration/code

              echo "=== Shard ${JOB_COMPLETION_INDEX}/${TOTAL_COMPLETIONS} starting ==="
              python3 -m experiments.runners.blis_shard
              echo "=== Shard ${JOB_COMPLETION_INDEX} complete ==="

          env:
            - name: TOTAL_COMPLETIONS
              value: "512"
            - name: BLIS_BINARY
              value: "/data/config-exploration/bin/blis"
            - name: DEFAULTS_FILEPATH
              value: "/data/config-exploration/defaults.yaml"
            - name: RESULTS_DIR
              value: "/data/config-exploration/results/raw/blis-sweep-v3"
            - name: HARDWARE_CONFIG
              value: "/data/config-exploration/hardware_config.json"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: HF_TOKEN
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"

          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"

          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: data
              mountPath: /data

      volumes:
        - name: workspace
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
