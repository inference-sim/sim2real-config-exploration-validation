# Source: llm-d-modelservice/templates/decode-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meta-lla-77b3c6b1-2-70b-hf-decode
  labels:
    helm.sh/chart: llm-d-modelservice-v0.4.15
    app.kubernetes.io/version: "v0.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/inferenceServing: "true"
      llm-d.ai/model: meta-lla-77b3c6b1-2-70b-hf
      llm-d.ai/role: decode
  template:
    metadata:
      labels:
        llm-d.ai/inference-serving: "true"
        llm-d.ai/inferenceServing: "true"
        llm-d.ai/model: meta-lla-77b3c6b1-2-70b-hf
        llm-d.ai/role: decode
    spec:
      initContainers:
        - name: routing-proxy
          args:
            - --port=8000
            - --vllm-port=8200
            - --connector=nixlv2
            - --zap-encoder=json
            - --zap-log-level=debug
            - --secure-proxy=false
          image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.8.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: 4
              memory: 16Gi
            requests:
              cpu: 4
              memory: 16Gi
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
    
      schedulerName: default-scheduler
      serviceAccountName: meta-lla-77b3c6b1-2-70b-hf
      
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: nvidia.com/gpu.product
                  operator: In
                  values:
                    - NVIDIA-H100-80GB-HBM3
      volumes:
      
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc
            readOnly: true
      
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.22.1
            
          livenessProbe:
            failureThreshold: 3
            periodSeconds: 5
            tcpSocket:
              port: 8000
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          imagePullPolicy: IfNotPresent
          
          command:
            - /bin/bash
            - -c
          args:
            - |
              /bin/true; vllm serve /model-cache/models/meta-llama/Llama-2-70b-hf \
                --host 0.0.0.0 \
                --served-model-name meta-llama/Llama-2-70b-hf \
                --port $VLLM_METRICS_PORT \
                --block-size $VLLM_BLOCK_SIZE \
                --max-model-len $VLLM_MAX_MODEL_LEN \
                --tensor-parallel-size $VLLM_TENSOR_PARALLELISM \
                --gpu-memory-utilization $VLLM_ACCELERATOR_MEM_UTIL \
                --enforce-eager \
                --no-enable-log-requests \
                --disable-uvicorn-access-log \
                --max-num-seqs=8 \
                --enable-chunked-prefill \
                --no-disable-uvicorn-access-log \
                --no-enforce-eager \
                --dtype=bfloat16 \
                --max-model-len=4096
          env:
          - name: VLLM_IS_DECODE
            value: "1"
          - name: HOME
            value: /tmp
          - name: HF_HOME
            value: /tmp/huggingface
          - name: MODEL_NAME
            value: meta-llama/Llama-2-70b-hf
          - name: MODEL_PATH
            value: models/meta-llama/Llama-2-70b-hf
          - name: VLLM_CACHE_ROOT
            value: /tmp/vllm
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
            value: "1"
          - name: VLLM_SERVER_DEV_MODE
            value: "1"
          - name: VLLM_INFERENCE_PORT
            value: "8000"
          - name: VLLM_METRICS_PORT
            value: "8200"
          - name: VLLM_BLOCK_SIZE
            value: "16"
          - name: VLLM_MAX_MODEL_LEN
            value: "4096"
          - name: VLLM_LOAD_FORMAT
            value: auto
          - name: VLLM_ACCELERATOR_MEM_UTIL
            value: "0.9"
          - name: VLLM_MAX_NUM_SEQ
            value: "256"
          - name: VLLM_TENSOR_PARALLELISM
            value: "4"
          - name: VLLM_MAX_NUM_BATCHED_TOKENS
            value: "256"
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_NIXL_SIDE_CHANNEL_PORT
            value: "5557"
          - name: UCX_TLS
            value: sm,cuda_ipc,cuda_copy,tcp
          - name: UCX_SOCKADDR_TLS_PRIORITY
            value: tcp
          - name: POD_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
          - name: LLMDBENCH_POD_NS
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: LOGNAME
            value: vllm
          - name: DP_SIZE
            value: "1"
          - name: TP_SIZE
            value: "4"
          - name: DP_SIZE_LOCAL
            value: "1"
          
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: HF_TOKEN
          
          resources:
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "4"
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "4"
          
          volumeMounts:
            - name: model-storage
              mountPath: /model-cache
              readOnly: true

