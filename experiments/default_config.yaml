# Experiment definition for config exploration.
#
# Copy this file, edit it, and pass with:
#   python -m experiments.run_all --config my_config.yaml <command>
#
# Every field has a default; you only need to specify what you want to change.

experiment:
  name: config-exploration-llama3-8b
  description: Llama 3.1 8B on H100, SLO 300ms TTFT

model:
  name: meta-llama/Llama-3.1-8B
  hardware: H100_SXM_80GB
  max_gpus: 8
  gpu_cost_per_hour: 3.20

workload:
  # Available presets: chatbot, contentgen, summarization, multidoc
  preset: chatbot
  num_requests: 10000
  rate: 10.0
  isl_mean: 512
  isl_max: 2048
  osl_mean: 256
  osl_max: 1024
  arrival_pattern: poisson
  seed: 42

slo:
  ttft_mean_ms: 300

blis:
  strategy: tpe
  budget: 50
  fitness_weights: "throughput:0.4,p99_ttft:0.3,p99_e2e:0.3"
  fixed_rate: 200

vidur:
  num_requests: 500
  start_qps: 10
  max_bisect_iters: 8
  lean: true
  # Vidur's bundled profiling data yields inflated absolute latencies (~100x).
  # Multiplier scales SLO threshold so binary search finds meaningful results.
  slo_multiplier: 100

llmservingsim:
  num_requests: 500
  start_rate: 10
  max_bisect_iters: 8
  lean: true

analysis:
  top_k: 3
  min_throughput_tok_s: 200

tools:
  - blis
  - llmservingsim
  - aiconfigurator
  - vidur
  - llm-optimizer
